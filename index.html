<!doctype html>

    <title>Hello Fellow Voter</title>
    <link rel="icon" href="data:," />
    <style>
      /* Critical CSS for .gh-corner below: this markup renders before
         style.css (loaded via JS import) reaches the page in dev mode,
         so it needs its own styling to avoid a flash of a huge, unpositioned
         icon. Keep this in sync with --gh-corner-size in src/style.css. */
      .gh-corner {
        position: fixed;
        top: 0;
        right: 0;
        display: block;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 0 58px 58px 0;
        border-color: transparent #24292e transparent transparent;
        z-index: 1000;
        color: #fff;
        transition: border-color 0.15s ease;
      }
      .gh-corner:hover {
        border-color: transparent #2563eb transparent transparent;
      }
      .gh-corner__icon {
        position: absolute;
        top: 4px;
        right: -54px;
        transform: rotate(45deg);
        width: 30px;
        height: 30px;
        display: block;
      }
    </style>
  </head>

    <div id="app"></div>
    <a

      href="https://github.com/conorgil/hello-fellow-voter"
      target="_blank"
      rel="noopener"
